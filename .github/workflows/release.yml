name: Release

# Publishes the version in package.json to npm, then tags it and creates a GitHub release.
#
# To release: bump the version in package.json, add a matching section to CHANGELOG.md, merge, then
# run this workflow from the Actions tab (or `gh workflow run release.yml`).
#
# It's safe to re-run: if the tag or GitHub release already exists, that step is skipped, and the
# run fails early if the version is already on npm.
on:
  workflow_dispatch:

permissions:
  # Creates the tag and the GitHub release.
  contents: write
  # Lets npm verify this workflow with trusted publishing, and adds provenance to the package.
  id-token: write

concurrency: release

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read the version
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the version isn't already on npm
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "::error::$SPEC is already on npm. Bump the version in package.json first."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The v$VERSION release already exists."
            exit 0
          fi

          # Use this version's section of the changelog as the release notes.
          notes="$(awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md)"

          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "${notes:-Version $VERSION}"
