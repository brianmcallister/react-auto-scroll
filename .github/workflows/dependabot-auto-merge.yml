name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates, so GitHub merges them once the
# required checks pass. Major updates are left for a person to review.
#
# Needs "Allow auto-merge" in the repository settings, and required status checks on main.
# Without required checks, auto-merge would merge before CI finishes.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
