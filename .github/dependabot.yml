version: 2

# Each group only takes patch and minor updates, which the auto-merge workflow merges once CI
# passes. Major updates come as their own pull requests, for a person to review.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint only supports TypeScript below 6.1, so a TypeScript major would fail lint.
      # Update it by hand once typescript-eslint supports the new version.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: monthly
    groups:
      demo:
        patterns: ['*']
        update-types: ['minor', 'patch']
